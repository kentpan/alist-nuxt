name: Stage 2 - Clean distribution package
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-stage2-clean.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build a clean, secret-free distribution ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data download
          mkdir -p download
          zip -qr download/alist-nuxt-stage2.zip . -x '.git/*' 'node_modules/*' '.nuxt/*' '.output/*' 'download/*'
          unzip -t download/alist-nuxt-stage2.zip
          if unzip -Z1 download/alist-nuxt-stage2.zip | grep -E '(^|/)(\.env$|[^/]+\.db(-[^/]*)?$|[^/]+\.sqlite3?$)'; then
            echo 'Refusing to publish a package containing environment files or database files.'
            exit 1
          fi
          test -s download/alist-nuxt-stage2.zip
          sha256sum download/alist-nuxt-stage2.zip
      - uses: actions/upload-artifact@v4
        with:
          name: alist-nuxt-stage2-clean-package
          path: download/alist-nuxt-stage2.zip
          if-no-files-found: error
          retention-days: 30
