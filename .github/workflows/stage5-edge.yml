name: Stage 5 - Edge and signed media validation
on:
  push:
    branches: [main]
    paths:
      - 'nuxt.config.ts'
      - 'server/utils/database.ts'
      - 'server/utils/storage.ts'
      - 'server/utils/download-sign.ts'
      - 'server/utils/fs-api.ts'
      - 'server/routes/d/**'
      - 'server/api/fs/**'
      - 'tests/database-adapter.test.ts'
      - 'tests/download-sign.test.mjs'
      - 'tests/storage*'
      - 'app/pages/index.vue'
      - 'scripts/smoke-fs.mjs'
      - 'scripts/smoke-webdav.mjs'
      - 'scripts/smoke-browser.mjs'
      - 'scripts/rotate-webdav-credentials.mjs'
      - 'tests/credential-*.test.mjs'
      - 'server/utils/credential-crypto.ts'
      - 'server/api/admin/storage/**'
      - 'package.json'
      - '.env.example'
  pull_request:
    branches: [main]
    paths:
      - 'nuxt.config.ts'
      - 'server/utils/database.ts'
      - 'server/utils/storage.ts'
      - 'server/utils/download-sign.ts'
      - 'server/utils/fs-api.ts'
      - 'server/routes/d/**'
      - 'server/api/fs/**'
      - 'tests/database-adapter.test.ts'
      - 'tests/download-sign.test.mjs'
      - 'tests/storage*'
      - 'app/pages/index.vue'
      - 'scripts/smoke-fs.mjs'
      - 'scripts/smoke-browser.mjs'
      - 'scripts/rotate-webdav-credentials.mjs'
      - 'tests/credential-*.test.mjs'
      - 'server/utils/credential-crypto.ts'
      - 'server/api/admin/storage/**'
      - 'package.json'
      - '.env.example'
permissions:
  contents: read
jobs:
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests including mocked D1 and HMAC signatures
        run: npm test
      - name: Validate Prisma schema
        env:
          DATABASE_URL: file:../data/ci.db
        run: npx prisma validate
      - name: Type check
        run: npx nuxt typecheck
      - name: Build Node server
        run: npm run build
      - name: Build Cloudflare Pages worker without deploying
        env:
          NITRO_PRESET: cloudflare_pages
        run: npm run build
      - name: Verify generated Edge worker entrypoint
        run: test -s .output/server/index.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project and Chromium
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Test and build Node server
        env:
          DATABASE_URL: file:../data/ci.db
        run: |
          npm test
          npx prisma validate
          npx nuxt typecheck
          npm run build
      - name: Prepare isolated database
        env:
          DATABASE_URL: file:../data/ci.db
          DATABASE_PATH: ./data/ci.db
          BOOTSTRAP_ADMIN_USERNAME: admin
          BOOTSTRAP_ADMIN_PASSWORD: stage5-ci-only-password
          ALLOW_REGISTER: 'true'
        run: |
          mkdir -p data
          npm run db:migrate
          npm run db:seed
      - name: Start disposable Apache WebDAV provider
        run: |
          set -euo pipefail
          docker run --detach --rm --name alist-webdav-ci --publish 127.0.0.1:8765:80 \
            --env AUTH_TYPE=Basic --env USERNAME=stage6-ci --env PASSWORD=stage6-ci-only-password \
            bytemark/webdav:2.4
          for attempt in $(seq 1 30); do
            if curl -fsS -u stage6-ci:stage6-ci-only-password -X PROPFIND -H 'Depth: 0' http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS -u stage6-ci:stage6-ci-only-password -X PROPFIND -H 'Depth: 0' http://127.0.0.1:8765/ >/dev/null
      - name: Exercise APIs and browser preview
        env:
          DATABASE_PATH: ./data/ci.db
          NUXT_DATABASE_PATH: ./data/ci.db
          JWT_SECRET: stage5-ci-only-jwt-secret
          NUXT_JWT_SECRET: stage5-ci-only-jwt-secret
          NUXT_STORAGE_CREDENTIALS_KEY: stage5-ci-only-webdav-key-with-at-least-32-characters
          WEBDAV_EXTERNAL_URL: http://127.0.0.1:8765/
          WEBDAV_USERNAME: stage6-ci
          WEBDAV_PASSWORD: stage6-ci-only-password
          BOOTSTRAP_ADMIN_PASSWORD: stage5-ci-only-password
          ALLOW_REGISTER: 'true'
          LOCAL_STORAGE_ROOT: ./data/storage
          NITRO_HOST: 127.0.0.1
          NITRO_PORT: 3000
        run: |
          set -euo pipefail
          node .output/server/index.mjs > /tmp/alist-stage5-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; docker stop alist-webdav-ci >/dev/null 2>&1 || true; cat /tmp/alist-stage5-server.log' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke-auth.mjs
          node scripts/smoke-fs.mjs
          node scripts/seed-storage.mjs
          node scripts/smoke-webdav.mjs
          node scripts/smoke-browser.mjs
