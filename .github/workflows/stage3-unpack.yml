name: Stage 3 - Apply source bundle
on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/stage3-part-8.b64'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and restore Stage 3 bundle
        run: |
          set -euo pipefail
          cat bootstrap/stage3-part-{1..8}.b64 | base64 -d > /tmp/stage3-delta.tar.gz
          echo "0195ec9e9a7a66bb6ebb4ca6095bd259bde5d4d0ddd07b57c308df4dcf66881f  /tmp/stage3-delta.tar.gz" | sha256sum -c -
          tar -xzf /tmp/stage3-delta.tar.gz -C .
          rm -f bootstrap/stage3-part-*.b64
      - name: Commit Stage 3 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(stage-3): add Local storage driver and filesystem APIs'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
