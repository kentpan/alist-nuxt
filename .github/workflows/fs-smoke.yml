name: Stage 3 - Local filesystem integration
on:
  push:
    branches: [main]
    paths:
      - 'server/api/admin/storage/**'
      - 'server/api/admin/driver/**'
      - 'server/api/fs/**'
      - 'server/routes/d/**'
      - 'server/utils/storage.ts'
      - 'server/utils/fs-api.ts'
      - 'server/utils/driver-catalog.ts'
      - 'drivers/catalog.json'
      - 'prisma/**'
      - 'scripts/smoke-fs.mjs'
      - 'tests/storage*'
  pull_request:
    branches: [main]
    paths:
      - 'server/api/admin/storage/**'
      - 'server/api/admin/driver/**'
      - 'server/api/fs/**'
      - 'server/routes/d/**'
      - 'server/utils/storage.ts'
      - 'server/utils/fs-api.ts'
      - 'server/utils/driver-catalog.ts'
      - 'drivers/catalog.json'
      - 'prisma/**'
      - 'scripts/smoke-fs.mjs'
      - 'tests/storage*'
permissions:
  contents: read
jobs:
  filesystem:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit and migration tests
        run: npm test
      - name: Validate Prisma schema
        env:
          DATABASE_URL: file:../data/ci.db
        run: npx prisma validate
      - name: Type check
        run: npx nuxt typecheck
      - name: Build Node server
        run: npm run build
      - name: Migrate and seed isolated CI database
        env:
          DATABASE_URL: file:../data/ci.db
          DATABASE_PATH: ./data/ci.db
          BOOTSTRAP_ADMIN_USERNAME: admin
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-stage3-password
          ALLOW_REGISTER: 'true'
        run: |
          set -euo pipefail
          mkdir -p data
          npm run db:migrate
          npm run db:seed
      - name: Exercise authentication and Local filesystem APIs
        env:
          DATABASE_PATH: ./data/ci.db
          NUXT_DATABASE_PATH: ./data/ci.db
          JWT_SECRET: ci-only-stage3-jwt-secret
          NUXT_JWT_SECRET: ci-only-stage3-jwt-secret
          NUXT_TOKEN_EXPIRES_IN: '48'
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-stage3-password
          ALLOW_REGISTER: 'true'
          NITRO_HOST: 127.0.0.1
          NITRO_PORT: 3000
        run: |
          set -euo pipefail
          node .output/server/index.mjs > /tmp/alist-stage3-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/alist-stage3-server.log' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke-auth.mjs
          node scripts/smoke-fs.mjs
