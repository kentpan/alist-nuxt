name: Stage 1 - Runtime foundation CI
on:
  push:
    branches: [main]
    paths-ignore:
      - 'bootstrap/**'
      - '.github/workflows/stage2-apply.yml'
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Commit npm lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: add npm lockfile' || true
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Test local Node SQLite and D1 adapter contracts
        run: npm test
      - name: Validate Prisma schema
        env:
          DATABASE_URL: file:./data/ci.db
        run: npx prisma validate
      - name: Type check
        run: npx nuxt typecheck
      - name: Build Node server
        env:
          DATABASE_PATH: ./data/ci.db
        run: npm run build
      - name: Smoke-test built Node server health endpoint
        env:
          NITRO_HOST: 127.0.0.1
          NITRO_PORT: 3000
          DATABASE_PATH: ./data/ci.db
        run: |
          set -euo pipefail
          mkdir -p data
          node .output/server/index.mjs > /tmp/alist-nuxt-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/alist-nuxt-health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/alist-nuxt-health.json
          node -e "const h=JSON.parse(require('fs').readFileSync('/tmp/alist-nuxt-health.json')); if(h.status !== 'ok' || h.productionConnected !== false) process.exit(1)"
