name: Stage 1 - Package verified migration workspace
on:
  workflow_run:
    workflows: ["Stage 1 - Runtime foundation CI"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: write
jobs:
  package:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Create stage 1 source package
        run: |
          set -euo pipefail
          mkdir -p download
          zip -qr download/alist-nuxt-stage1.zip . -x '.git/*' 'node_modules/*' '.nuxt/*' '.output/*' 'download/*'
          unzip -t download/alist-nuxt-stage1.zip
          sha256sum download/alist-nuxt-stage1.zip
      - uses: actions/upload-artifact@v4
        with:
          name: alist-nuxt-stage1-package
          path: download/alist-nuxt-stage1.zip
          if-no-files-found: error
          retention-days: 30
